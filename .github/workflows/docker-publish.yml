name: Build and Push to ghcr.io

# Builds the Azure Pipelines agent image from the Dockerfile and pushes it to the
# GitHub Container Registry under the repository owner's namespace:
#   ghcr.io/<owner>/azp-agent
# `github.repository_owner` resolves to whoever owns the repo, so this works for
# a personal account without hardcoding a username.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "Dockerfile"
      - "start.sh"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

# Required to push packages to ghcr.io with the auto-generated GITHUB_TOKEN.
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ${{ github.repository_owner }}/azp-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
